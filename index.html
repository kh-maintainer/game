<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Foundry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- PeerJS: WebRTC peer-to-peer for online co-op (no game server needed) -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <canvas id="view"></canvas>

  <header id="topbar">
    <div class="logo">PIXEL<span>FOUNDRY</span></div>
    <div class="cash"><div id="money">$0</div><div id="income">+$0/s</div></div>
    <div id="patents" class="hidden" title="Patents (prestige currency)"></div>
    <div class="spacer"></div>
    <button id="net-pill" title="Online co-op">👥 Co-op</button>
    <button id="btn-help" title="How to play (H)">?</button>
    <button id="btn-settings" title="Settings">⚙</button>
  </header>

  <div id="leftcol">
    <div id="goal"></div>
    <div id="inspector" class="hidden"></div>
  </div>

  <aside id="panel">
    <button id="panel-toggle" title="Toggle panel">≡</button>
    <div class="tabs">
      <button data-tab="upgrades" class="on">Upgrades</button>
      <button data-tab="research">Research</button>
      <button data-tab="patents">Patents</button>
      <button data-tab="awards">Awards</button>
      <button data-tab="stats">Stats</button>
    </div>
    <div class="body"></div>
  </aside>

  <div id="chat" class="hidden">
    <div id="chat-log"></div>
    <input id="chat-input" maxlength="200" placeholder="Enter to chat · G to ping" autocomplete="off">
  </div>
  <canvas id="minimap" width="112" height="112" title="Minimap — click to jump"></canvas>
  <div id="status"></div>
  <nav id="toolbar"></nav>
  <div id="tooltip" class="hidden"></div>
  <div id="toasts"></div>
  <div id="modal" class="hidden"><div class="mbox"></div></div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/render.js"></script>
  <script src="js/net.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
