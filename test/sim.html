<!DOCTYPE html><html><body><pre id="out"></pre>
<script src="../js/data.js"></script><script src="../js/game.js"></script>
<script>
// Headless simulation tests. Open in a browser (or headless Chrome --dump-dom).
const log = [];
const check = (name, cond, extra = '') => log.push((cond ? 'PASS ' : 'FAIL ') + name + ' ' + extra);
const run = (g, secs) => { for (let i = 0; i < secs * 20; i++) g.update(TICK); };
const fresh = (seed) => { const g = new Game(seed); g.money = 1e12; g.land = LAND_COSTS.length; return g; };
try {
  // 1. raw ore line
  let g = fresh(12345);
  let c = g.center(), y = c.y;
  g.ore[y * g.w + c.x - 5] = 'iron_ore';
  g.place('miner', c.x - 5, y, 0);
  for (let x = c.x - 4; x < c.x; x++) g.place('belt', x, y, 0);
  const m0 = g.money;
  run(g, 30);
  check('raw ore line earns', g.money - m0 > 10, 'earned=' + (g.money - m0).toFixed(1));

  // 2. smelter
  g.remove(c.x - 2, y); g.place('smelter', c.x - 2, y, 0);
  g.stats.sold = {};
  run(g, 30);
  check('smelter sells plates', (g.stats.sold.iron_plate || 0) > 5, JSON.stringify(g.stats.sold));

  // 3. belt throughput
  let g2 = fresh(7); c = g2.center();
  for (let x = c.x - 20; x < c.x; x++) g2.place('belt', x, c.y, 0);
  for (let x = c.x - 20; x < c.x - 14; x++) { g2.ore[(c.y - 1) * g2.w + x] = 'iron_ore'; g2.place('miner', x, c.y - 1, 1); }
  run(g2, 20); // warm-up: first item needs ~12s to cross 20 tiles
  const before = g2.stats.sold.iron_ore || 0;
  run(g2, 40);
  const rate = (g2.stats.sold.iron_ore - before) / 40;
  check('belt throughput', rate > 1.5, 'items/s=' + rate.toFixed(2) + ' (belt speed ' + g2.beltSpeed() + ')');

  // 4. assembler gears
  let g3 = fresh(9); g3.research.assembly = true; c = g3.center();
  g3.ore[c.y * g3.w + c.x - 5] = 'iron_ore';
  g3.place('miner', c.x - 5, c.y, 0); g3.place('belt', c.x - 4, c.y, 0);
  g3.place('smelter', c.x - 3, c.y, 0); g3.place('belt', c.x - 2, c.y, 0);
  g3.place('assembler', c.x - 1, c.y, 0);
  run(g3, 30);
  check('assembler idle without power', !(g3.stats.sold.gear > 0) && g3.power.ratio === 0, 'ratio=' + g3.power.ratio);
  // coal miner -> generator powers the grid
  g3.ore[(c.y + 3) * g3.w + c.x - 5] = 'coal';
  g3.place('miner', c.x - 5, c.y + 3, 0);
  g3.place('generator', c.x - 4, c.y + 3, 0);
  run(g3, 60);
  check('generator powers assembler', (g3.stats.sold.gear || 0) > 3 && g3.power.ratio === 1, JSON.stringify(g3.stats.sold) + ' ratio=' + g3.power.ratio);
  const gen = g3.at(c.x - 4, c.y + 3);
  check('generator burns coal slowly at low load', gen.fuel > 0 && gen.fuel <= GEN_FUEL_CAP, 'fuel=' + gen.fuel);

  // 4b. miners chain: three miners in a row all pushing east, output passes through
  let gch = fresh(19); c = gch.center();
  for (let x = c.x - 3; x < c.x; x++) { gch.ore[c.y * gch.w + x] = "iron_ore"; gch.place("miner", x, c.y, 0); }
  run(gch, 40);
  const chainRate = gch.stats.sold.iron_ore / 40;
  check('miner chain passes items through', chainRate > 1.5, 'items/s=' + chainRate.toFixed(2) + ' (one miner = ' + BASE_MINER_RATE + ')');

  // 4c. deep drill is 3x a miner (needs power)
  let gd = fresh(23); gd.research.deepdrills = true; gd.research.solar = true; c = gd.center();
  gd.ore[c.y * gd.w + c.x - 1] = 'iron_ore'; gd.place('deepdrill', c.x - 1, c.y, 0);
  gd.place('solar', c.x + 3, c.y + 3, 0);
  run(gd, 30);
  const ddRate = gd.stats.sold.iron_ore / 30;
  check('deep drill ~3x miner speed', ddRate > BASE_MINER_RATE * 2.5, 'items/s=' + ddRate.toFixed(2));

  // 5. tunnel: miner -> tunnel in ... tunnel out -> belt -> market
  let g4 = fresh(3); g4.research.logistics = true; g4.research.splitter = true; c = g4.center();
  g4.ore[c.y * g4.w + c.x - 7] = 'copper_ore';
  g4.place('miner', c.x - 7, c.y, 0);
  g4.place('tunnel', c.x - 6, c.y, 0);
  g4.place('chest', c.x - 4, c.y, 0); // obstacle the tunnel passes under
  g4.place('tunnel', c.x - 2, c.y, 0);
  g4.place('belt', c.x - 1, c.y, 0);
  const tin = g4.at(c.x - 6, c.y), tout = g4.at(c.x - 2, c.y);
  check('tunnel auto-pairs', tin.mode === 'in' && tout.mode === 'out' && g4.tunnelPartner(tin) === tout, tin.mode + '/' + tout.mode);
  run(g4, 30);
  check('tunnel carries items', (g4.stats.sold.copper_ore || 0) > 8, JSON.stringify(g4.stats.sold));

  // 6. chest buffers then releases; sorter routes
  let g5 = fresh(5); g5.research.logistics = true; c = g5.center();
  g5.ore[c.y * g5.w + c.x - 4] = 'iron_ore';
  g5.place('miner', c.x - 4, c.y, 0);
  g5.place('chest', c.x - 3, c.y, 0);
  g5.place('sorter', c.x - 2, c.y, 0);
  g5.at(c.x - 2, c.y).filter = 'iron_ore';
  g5.place('belt', c.x - 1, c.y, 0);
  run(g5, 20);
  check('chest + sorter pass-through', (g5.stats.sold.iron_ore || 0) > 6, JSON.stringify(g5.stats.sold));
  // non-matching filter: item must go sideways (nothing to the side -> blocks)
  g5.at(c.x - 2, c.y).filter = 'gear';
  g5.stats.sold = {};
  run(g5, 10);
  check('sorter blocks non-matching straight', (g5.stats.sold.iron_ore || 0) <= 1, JSON.stringify(g5.stats.sold));
  check('chest fills while blocked', g5.at(c.x - 3, c.y).store.length > 3, 'store=' + g5.at(c.x - 3, c.y).store.length);

  // 7. land restriction
  let g6 = new Game(1); c = g6.center();
  check('land blocks far placement', g6.placeError('belt', c.x + 20, c.y) && g6.placeError('belt', c.x + 20, c.y).startsWith('Land'), g6.placeError('belt', c.x + 20, c.y));
  g6.money = 1e6;
  g6.apply({ type: 'land' });
  check('buying land expands', g6.land === 1 && !g6.placeError('belt', c.x + 15, c.y), 'land=' + g6.land);

  // 8. patents are earned without any reset
  let g7 = fresh(11); c = g7.center();
  g7.place('belt', c.x - 1, c.y, 0);
  const before7 = g7.buildings.length;
  check('no prestige action', !g7.apply({ type: 'prestige', seed: 42 }).ok && g7.buildings.length === before7);
  g7.goalIdx = CHAPTERS[1].from - 1;
  GOALS[g7.goalIdx].check = () => true; // force-complete the last goal of chapter 1
  g7.checkProgress();
  check('chapter completion grants patents', g7.meta.patents === PATENT_REWARDS.chapter && g7.buildings.length === before7, 'patents=' + g7.meta.patents);
  g7.meta.patents = 5;
  g7.apply({ type: 'patent', id: 'brand_value' });
  check('patent shop', g7.patentLvl('brand_value') === 1 && g7.sellMult() > 1.3, 'mult=' + g7.sellMult().toFixed(2));
  // every N delivered orders pays a patent
  g7.meta.patents = 0; g7.meta.life.contracts = PATENT_REWARDS.contracts - 1;
  g7.stats.sold.iron_plate = 100; g7.stats.playTime = 100; g7.newContract();
  const ct7 = g7.contract; for (let i = 0; i < ct7.qty; i++) g7.sell(ct7.item);
  check('orders pay patents', g7.meta.patents === 1, 'patents=' + g7.meta.patents);

  // 9. launch: pays patents, factory keeps running, next launch needs more robots
  let g8 = fresh(13); g8.research.spaceflight = true; c = g8.center();
  g8.place('launchpad', c.x + 3, c.y, 0);
  const pad = g8.at(c.x + 3, c.y);
  const req1 = g8.launchReq();
  for (let i = 0; i < req1; i++) LOGIC.launchpad.insert(g8, pad, 'robot');
  run(g8, 5);
  check('launch completes', g8.meta.launches === 1 && g8.meta.patents === PATENT_REWARDS.launch && pad.count === 0 && g8.buildings.length > 1, 'launches=' + g8.meta.launches);
  check('next launch needs more robots', g8.launchReq() > req1, req1 + ' -> ' + g8.launchReq());

  // 10. co-op: host & guest apply the same actions in the same order + snapshot sync
  const host = fresh(99), guest = fresh(99); guest.isGuest = true;
  c = host.center();
  const acts = [
    { type: 'place', b: 'belt', x: c.x - 1, y: c.y, dir: 0 },
    { type: 'place', b: 'belt', x: c.x - 2, y: c.y, dir: 0 },
    { type: 'setdir', x: c.x - 2, y: c.y, dir: 0 },
    { type: 'upgrade', id: 'belt_speed' },
    { type: 'research', id: 'splitter' },
    { type: 'place', b: 'splitter', x: c.x - 3, y: c.y, dir: 0 },
    { type: 'rotate', x: c.x - 3, y: c.y, delta: 1 },
    { type: 'remove', x: c.x - 3, y: c.y },
  ];
  for (const a of acts) { const r = host.apply(a); if (r.ok) guest.apply(a); }
  const sameBuild = JSON.stringify(host.serialize().buildings) === JSON.stringify(guest.serialize().buildings);
  check('co-op action replay matches', sameBuild && host.money === guest.money, host.buildings.length + ' vs ' + guest.buildings.length);
  run(host, 5);
  const snap = JSON.parse(JSON.stringify(host.serialize()));
  guest.restore(snap);
  check('snapshot restore exact', JSON.stringify(guest.serialize().buildings) === JSON.stringify(host.serialize().buildings) && guest.money === host.money);
  const other = new Game(1234); other.restore(snap);
  check('snapshot restore across seeds', other.seed === 99 && other.oreAt(0, 0) === host.oreAt(0, 0) && other.buildings.length === host.buildings.length);

  // 11. save roundtrip incl. items in transit
  const s = g4.serialize();
  const g9 = Game.fromData(JSON.parse(JSON.stringify(s)));
  check('save roundtrip', g9.buildings.length === g4.buildings.length && g9.money === g4.money && JSON.stringify(g9.serialize().buildings) === JSON.stringify(s.buildings));

  // 12. goals and achievements fire
  let ga = fresh(21); c = ga.center();
  ga.ore[c.y * ga.w + c.x - 3] = 'iron_ore';
  ga.place('miner', c.x - 3, c.y, 0); ga.place('belt', c.x - 2, c.y, 0); ga.place('belt', c.x - 1, c.y, 0);
  run(ga, 30);
  check('goals progress', ga.goalIdx >= 2, 'goalIdx=' + ga.goalIdx);
  check('achievements unlock', !!ga.meta.achievements.first_sale, Object.keys(ga.meta.achievements).join(','));

  // 12b. story events fire once per save
  check('story event on goal', ga.meta.storySeen.g0 === 1 && ga.meta.storySeen.g1 === 1);
  const storyCount = () => ga.events.filter((e) => e.type === 'story').length;
  const sBefore = storyCount(); ga.storyEvent('g0');
  check('story lines play once', storyCount() === sBefore);

  // 12c. Marlo's contracts: appear, count deliveries, pay a premium
  let gc = fresh(31); c = gc.center();
  gc.goalIdx = 5; gc.stats.sold.iron_plate = 100; gc.stats.playTime = 100;
  gc.newContract();
  const ct = gc.contract;
  check('contract created', ct && ct.item === 'iron_plate' && ct.qty >= 5 && ct.reward > ct.qty * ITEMS.iron_plate.value, JSON.stringify(ct));
  const mBefore = gc.money;
  for (let i = 0; i < ct.qty; i++) gc.sell('iron_plate');
  check('contract pays on completion', !gc.contract && gc.money - mBefore >= ct.reward, 'gain=' + (gc.money - mBefore).toFixed(0) + ' reward=' + ct.reward);
  gc.newContract(); gc.contract.t = 0.1; gc.updateContract(0.5);
  check('contract expires', !gc.contract && gc.events.some((e) => e.type === 'contract' && e.state === 'fail'));
  const snapC = JSON.parse(JSON.stringify(gc.serialize())); gc.newContract(); const snap2 = JSON.parse(JSON.stringify(gc.serialize()));
  const gr = new Game(1); gr.restore(snap2);
  check('contract survives save/sync', gr.contract && gr.contract.item === gc.contract.item && gr.contract.qty === gc.contract.qty);

  // 13. v1 save migration
  const v1 = { seed: 5, money: 500, totalEarned: 1000, upgrades: { belt_speed: 2 }, research: {}, stats: { sold: { iron_ore: 10 } }, buildings: [{ t: 'belt', x: 40, y: 40, d: 0, p: 2 }] };
  const gm = Game.fromData(v1);
  check('v1 migration', gm.money === 500 && gm.lvl('belt_speed') === 2 && gm.buildings.length === 1 && gm.meta.life.itemsSold === 10);
} catch (e) { log.push('ERROR ' + e.stack); }
document.getElementById('out').textContent = log.join('\n');
</script></body></html>
